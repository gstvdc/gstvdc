name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: gstvdc
          outputs: |
            dist/snake.svg?color_snake=#CA8A04&color_dots=#ebedf0,#fef08a,#fde047,#eab308,#a16207
            dist/snake-dark.svg?palette=github-dark&color_snake=#FACC15&color_dots=#161b22,#3d2f00,#6b5200,#a37c00,#facc15

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
